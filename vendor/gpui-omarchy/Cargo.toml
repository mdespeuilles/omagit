# VENDORED — see ../README.md. Do not edit without recording the divergence there.
# Diverges from upstream 0.1.1 by:
#   - dropping the [[example]] targets (unused by omagit; they pull extra assets)
#   - dropping [profile.*] (ignored in workspace members; lifted to the workspace root)
#   - gpui-kit pinned through the workspace dependency table
[package]
name = "gpui-omarchy"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "A gpui-kit component library designed for the Omarchy system and its UI and UX conventions"
repository = "https://github.com/huacnlee/gpui-omarchy"
publish = false

[lib]
name = "gpui_omarchy"
path = "src/lib.rs"

[[test]]
name = "interaction"
path = "tests/interaction.rs"

[dependencies]
gpui-kit = { workspace = true, features = ["assets"] }
toml = "0.8"
chrono = "0.4.45"

[dev-dependencies]
tempfile = "3"
gpui-kit = { workspace = true, features = ["test-support"] }

# Upstream code is not held to omagit's lint level. Keeping src/ byte-identical
# to the published crate is what lets scripts/sync-vendor.sh tell a real upstream
# change from one of ours, so lints are silenced here rather than in the source.
[lints.clippy]
all = { level = "allow", priority = -1 }
