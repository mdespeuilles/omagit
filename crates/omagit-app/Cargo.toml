[package]
name = "omagit-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "omagit"
path = "src/main.rs"

[dependencies]
omagit-git = { workspace = true }
omagit-theme = { workspace = true }
omagit-settings = { workspace = true }
omagit-ui = { workspace = true }
gpui-kit = { workspace = true, features = ["assets"] }
gpui-omarchy = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
notify = { workspace = true }
async-channel = { workspace = true }
jiff = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# GPUI's test platform, for driving real keystrokes through the real widget
# tree. A dev-dependency only: the feature is additive, so it is on for
# `cargo test` and off in every build that ships.
gpui-kit = { workspace = true, features = ["test-support"] }
