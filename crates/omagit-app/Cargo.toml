[package]
name = "omagit-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# Tauri wants a library it can start from `main`, so the binary is a shim.
name = "omagit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "omagit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
omagit-git = { workspace = true }
omagit-theme = { workspace = true }
omagit-settings = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-updater = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
# `tauri::generate_context!` emits `serde_json` for the plugin configuration in
# `tauri.conf.json`, so the updater's block makes this a real dependency.
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
notify = { workspace = true }
jiff = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
# Tauri's own mock application, for the one thing no other suite can reach: that
# a repository opened through `AppState` really does report its changes to the
# window. Dev-only — the feature adds `tauri::test` and nothing to the bundle.
tauri = { workspace = true, features = ["test"] }
