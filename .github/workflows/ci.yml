name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # CI compiles each commit once and throws the tree away, so incremental
  # compilation buys nothing and cost 3.7 GB of the cached target directory.
  CARGO_INCREMENTAL: 0
  # Full debug info is most of what remains. Line tables still give a panic
  # backtrace with file and line, which is all a CI log is read for. Release is
  # left alone: it carries no debug info by default, so naming it here would
  # have added cost rather than removed it.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SPEC §3 rule 8: a milestone is a PR, green on Linux *and* macOS.
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A hung test used to run until the six-hour default killed it. This job
    # takes about two minutes warm and about eleven from an empty cache, so
    # anything past this is stuck, not slow.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-15
    steps:
      - uses: actions/checkout@v4

      # The toolchain comes from rust-toolchain.toml; this only adds caching
      # and makes the resolved version visible in the log.
      - name: Toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      # Saved only from `main`, and restored everywhere. GitHub gives a
      # repository 10 GB of cache and evicts the oldest entry past it; one
      # ~2 GB entry per branch per platform reached that limit within three
      # pull requests, so every run started cold — which is what a 28-minute
      # run was. One entry per platform stays well inside it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}-dev
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # GPUI renders through Vulkan/Wayland/X11 on Linux and needs these to
      # link. Kept in one place so a link failure reads as a missing package
      # rather than a mysterious build error.
      - name: Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libssl-dev libzstd-dev libvulkan1 libgit2-dev mesa-vulkan-drivers \
            pkg-config

      - name: fmt
        run: cargo fmt --all --check

      # gpui-omarchy is in the workspace but silences clippy from its own
      # manifest; see vendor/README.md.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Single-threaded: three of the four Working Copy tests, which drive
      # GPUI's test platform against a real repository, hung indefinitely on
      # one Linux run. Twelve local runs at the same parallelism never did, so
      # the cause is not understood and this is a mitigation, not a fix
      # (`docs/ARCHITECTURE.md` risk 7). It costs nothing: the four tests take
      # two seconds either way.
      - name: test
        timeout-minutes: 10
        run: cargo test --workspace -- --test-threads=1

  # Same gate, run beside the checks rather than after them (SPEC §3 rule 8
  # asks for a green release build, not for it to come last). It is the longest
  # single step in CI by a wide margin — sixteen minutes of the twenty-seven a
  # cold Linux run used to take — and it shares nothing with the dev profile, so
  # sequencing it behind clippy and the tests only added its cost to theirs.
  # In parallel the cold run is bounded by this job alone.
  release:
    name: ${{ matrix.name }} release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      # Its own entry: a release target directory shares no artefact with the
      # dev one, and mixing them in a single key would cache both under
      # whichever job saved last.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libssl-dev libzstd-dev libvulkan1 libgit2-dev mesa-vulkan-drivers \
            pkg-config

      - name: release build
        run: cargo build --workspace --release

  # SPEC §13: licences and advisories are part of the gate, not an afterthought.
  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories

  # The vendored crate must stay byte-identical to its upstream release, so an
  # accidental edit is caught here rather than at the next sync.
  vendor:
    name: vendor drift
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/sync-vendor.sh
