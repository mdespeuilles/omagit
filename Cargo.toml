[workspace]
resolver = "3"
members = [
    "crates/omagit-git",
    "crates/omagit-git-cli",
    "crates/omagit-theme",
    "crates/omagit-settings",
    "crates/omagit-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
repository = "https://github.com/omagit/omagit"

[workspace.dependencies]
# UI — Tauri 2: a Rust backend and a web front end (SPEC §4, amended).
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# Internal
omagit-git = { path = "crates/omagit-git" }
omagit-theme = { path = "crates/omagit-theme" }
omagit-settings = { path = "crates/omagit-settings" }

# Git — `gix` for reads (SPEC §8). Default features are trimmed to the read
# path: no network client (the `git` binary does the network), no
# worktree-mutation, no merge, no blame (out of MVP scope, SPEC §11).
# `max-performance-safe` is the parallel, pure-Rust profile: keeping the C
# zlib out is half the reason `gix` was chosen (SPEC §4).
gix = { version = "=0.87.1", default-features = false, features = [
    "max-performance-safe",
    "basic",
    "status",
    "sha1",
    "auto-chain-error",
] }

# Shared third-party
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# Only the tests parse JSON: the wire is Tauri's job everywhere else.
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
palette = "0.7"
notify = "8"
async-channel = "2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }

# Syntax highlighting for the diff viewer (SPEC §4). SPEC's own note says
# Local time, for an interface that says "aujourd'hui" and "il y a 2 h".
# Already in the tree under `gix`, so it costs no build time — see
# `omagit-app/src/time.rs` for why the alternative was worse.
jiff = "0.2"

[profile.dev]
debug = "limited"
